name: cli-integration
on: [pull_request, push]

jobs:
  cli-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build wheel
        run: uv build --wheel

      - name: Install CLI from wheel
        run: uv tool install dist/*.whl

      - name: Run create-benchmark-service from a clean directory
        run: |
          mkdir /tmp/cli-test
          cd /tmp/cli-test
          create-benchmark-service test

      - name: Verify generated project installs and passes lint
        working-directory: /tmp/cli-test/test-benchmark-service
        run: |
          make install
          make lint
