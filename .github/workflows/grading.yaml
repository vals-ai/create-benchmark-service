name: grading
on:
  push:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    working-directory: packages/vals-grading
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - run: make test lint typecheck build
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --no-dev
      - run: uv run --no-sync python tests/standalone_smoke.py
