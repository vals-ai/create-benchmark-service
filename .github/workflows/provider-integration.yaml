name: Sandbox provider integration tests

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  provider-integration:
    name: ${{ matrix.provider }} provider integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_AWS_REGION: ${{ secrets.TEST_AWS_REGION }}
      TEST_DAYTONA_SECRET_NAME: ${{ secrets.TEST_DAYTONA_SECRET_NAME }}
      TEST_MODAL_SECRET_NAME: ${{ secrets.TEST_MODAL_SECRET_NAME }}
    strategy:
      fail-fast: false
      matrix:
        provider:
          - daytona
          - modal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: make install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_TEST }}
          aws-region: ${{ env.TEST_AWS_REGION }}

      - name: Run provider integration tests
        run: uv run pytest tests/integration/test_sandbox_provider.py -v -k "${{ matrix.provider }}"
