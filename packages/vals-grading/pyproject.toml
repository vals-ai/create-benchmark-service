[project]
name = "vals-grading"
version = "0.1.0"
description = "Local benchmark check grading through the Model Gateway"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
# PLACEHOLDER: 0.1.38 stands for the first model-library release with gateway_token_scope; set the real version and re-lock once it is published.
gateway = ["model-library>=0.1.38"]
vals = ["valsai>=0.3.12"]

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1.3", "ruff>=0.15.9", "basedpyright>=1.39", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vals_grading"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.basedpyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["src", "tests", "examples"]
