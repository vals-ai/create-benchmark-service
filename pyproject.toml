[project]
name = "create-benchmark-service"
version = "0.1.0"
description = "Framework for building benchmark services"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "daytona==0.172.1a1",
    "fastapi[standard]>=0.135.3",
    "click>=8.3.2",
    "jinja2>=3.1.6",
    "websockets>=15.0.1",
    "httpx>=0.28.1",
    "tenacity>=8.3.0",
    "descope>=1.13.0",
    "cachetools>=5.5.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
create-benchmark-service = "cli.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.39.0",
    "ruff>=0.15.9",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark_service", "cli"]

[tool.hatch.build.targets.wheel.force-include]
".github" = ".github"
".gitignore" = ".gitignore"
".python-version" = ".python-version"
"Makefile" = "Makefile"
"templates" = "templates"

[tool.uv]
prerelease = "allow"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.basedpyright]
venvPath="."
venv=".venv"
typeCheckingMode = "strict"
reportExplicitAny = false
reportAny = false
reportMissingTypeStubs = false
enableTypeIgnoreComments = true
exclude = [".*", "**/*-service/"]
