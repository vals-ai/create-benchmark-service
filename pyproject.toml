[project]
name = "create-benchmark-service"
version = "0.1.0"
description = "Framework for building benchmark services"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "daytona>=0.144.0",
    "fastapi[standard]>=0.127.1",
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "websockets>=15.0",
    "httpx>=0.28.0",
    "pydantic>=2.12.5",
    "tenacity>=8.3.0,<9.0.0",
]

[project.scripts]
create-benchmark-service = "cli.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.38.0",
    "ruff>=0.14.10",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark_service", "cli"]

[tool.hatch.build.targets.wheel.force-include]
".github" = ".github"
".gitignore" = ".gitignore"
".python-version" = ".python-version"
"Makefile" = "Makefile"
"templates" = "templates"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.basedpyright]
venvPath="."
venv=".venv"
typeCheckingMode = "strict"
reportExplicitAny = false
reportAny = false
reportMissingTypeStubs = false
enableTypeIgnoreComments = true
exclude = [".*", "**/*-service/"]
